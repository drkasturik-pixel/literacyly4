<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OI and OU Sound Detective</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===================================== -->
<!-- SPLASH SCREEN -->
<!-- ===================================== -->

<div id="splashScreen">

    <img
        src="assets/innovine-logo.png"
        alt="Innovine Logo"
        id="logo"
    >

</div>

<!-- ===================================== -->
<!-- GAME CONTAINER -->
<!-- ===================================== -->

<div id="gameContainer" class="hidden">

    <!-- HEADER -->

    <header>

        <h1>OI and OU Sound Detective</h1>

        <div id="instructions">

            <p>
                Listen carefully to the word.
            </p>

            <p>
                Drag OI or OU into the blank.
            </p>

            <p>
                Choose the sound that completes the word.
            </p>

        </div>

        <div id="topBar">

            <button id="replayInstructionsBtn">
                🔊 Replay Instructions
            </button>

            <button id="replayWordBtn">
                🔈 Hear Word Again
            </button>

            <div id="scoreBox">
                Score:
                <span id="scoreValue">0</span>/8
            </div>

        </div>

    </header>

    <!-- ===================================== -->
    <!-- MAIN GAME -->
    <!-- ===================================== -->

    <main>

        <!-- PICTURE -->

        <section id="pictureArea">

            <img
                id="wordImage"
                src=""
                alt=""
            >

        </section>

        <!-- WORD AREA -->

        <section id="wordArea">

            <div id="wordDisplay">

                <span id="prefix"></span>

                <div id="dropZone">

                    ?

                </div>

                <span id="suffix"></span>

            </div>

        </section>

        <!-- DRAG OPTIONS -->

        <section id="choices">

            <div
                class="soundTile"
                draggable="true"
                data-sound="oi"
            >
                OI
            </div>

            <div
                class="soundTile"
                draggable="true"
                data-sound="ou"
            >
                OU
            </div>

        </section>

        <!-- FEEDBACK -->

        <section id="feedbackArea">

            <div
                id="correctFeedback"
                class="feedback hidden"
            >

                <div class="bigIcon">
                    ✅
                </div>

                <div class="feedbackText">
                    Great Job!
                </div>

                <div class="claps">
                    👏 👏 👏
                </div>

            </div>

            <div
                id="wrongFeedback"
                class="feedback hidden"
            >

                <div class="bigIcon">
                    ❌
                </div>

                <div class="feedbackText">
                    Try Again
                </div>

            </div>

        </section>

    </main>

</div>

<!-- ===================================== -->
<!-- END SCREEN -->
<!-- ===================================== -->

<div id="endScreen" class="hidden">

    <div class="endCard">

        <h1>
            🎉 Congratulations!
        </h1>

        <h2>
            You completed all the OI and OU words!
        </h2>

        <div id="finalScore">

            Final Score: 0 / 8

        </div>

        <div id="starContainer">

            ⭐⭐⭐⭐⭐

        </div>

        <button id="playAgainBtn">

            Play Again

        </button>

    </div>

</div>

<!-- ===================================== -->
<!-- AUDIO -->
<!-- ===================================== -->

<audio
    id="correctSound"
    preload="auto"
>
    <source
        src="assets/correct.mp3"
        type="audio/mpeg"
    >
</audio>

<audio
    id="wrongSound"
    preload="auto"
>
    <source
        src="assets/wrong.mp3"
        type="audio/mpeg"
    >
</audio>

<audio
    id="backgroundMusic"
    preload="auto"
    loop
>
    <source
        src="assets/background music.mp3"
        type="audio/mpeg"
    >
</audio>

<!-- ===================================== -->
<!-- LOADING SCREEN -->
<!-- ===================================== -->

<div id="loadingScreen">

    <div class="loadingBox">

        Loading...

    </div>

</div>

<!-- ===================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================== -->

<script src="script.js"></script>

</body>
</html>
